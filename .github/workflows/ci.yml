name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: punchcard
          POSTGRES_PASSWORD: punchcard
          POSTGRES_DB: punchcard_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U punchcard"
          --health-interval 5s --health-timeout 5s --health-retries 10

    # The e2e suite swaps the face service for a stub, so it does not run here.
    env:
      DATABASE_URL: postgresql://punchcard:punchcard@localhost:5432/punchcard_test?schema=public
      JWT_SECRET: ci-secret

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
        working-directory: api
      - run: npx prisma migrate deploy
        working-directory: api
      - run: npm run lint
        working-directory: api
      - run: npm test
        working-directory: api
      - run: npm run test:e2e
        working-directory: api
      - run: npm run build
        working-directory: api

  face:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: face/requirements*.txt
      # The hashes live in fetch_models.py, so a changed pin misses the cache.
      - uses: actions/cache@v4
        with:
          path: face/models
          key: models-${{ hashFiles('face/fetch_models.py') }}
      - run: pip install -r requirements-dev.txt
        working-directory: face
      - run: python fetch_models.py
        working-directory: face
      - run: pytest -q
        working-directory: face

  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
        working-directory: admin
      - run: npm run lint
        working-directory: admin
      - run: npm test
        working-directory: admin
      - run: npm run build
        working-directory: admin

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: app
      - run: dart format --output=none --set-exit-if-changed lib test
        working-directory: app
      - run: flutter analyze
        working-directory: app
      - run: flutter test
        working-directory: app

  # Builds the three images and checks the stack comes up healthy. The machine
  # this was written on can't run Docker, so this job is the only check the
  # Dockerfiles get.
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose up --build --detach --wait --wait-timeout 300
        env:
          PHONE_API_URL: http://localhost:3200
      - name: admin can log in through the api
        run: |
          curl -fsS -X POST localhost:3200/auth/login \
            -H 'content-type: application/json' \
            -d '{"email":"admin@example.com","password":"change-me"}' | grep -q token
          curl -fsS -o /dev/null localhost:3202/login
      - if: failure()
        run: docker compose logs
